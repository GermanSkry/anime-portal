name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

# a new push to the same branch cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        # A subset of requirements.txt, same pins: only what the tests import.
        # Installing all of it would pull ~2 GB of torch via sentence-transformers
        # on every run. A test that needs more fails loudly with ImportError.
        run: |
          pip install ruff==0.17.5
          pip install 'psycopg[binary]==3.2.13' 'openai==1.51.0' 'pydantic==2.9.0' \
                      'pydantic-settings==2.4.0' 'httpx==0.27.0'

      - name: Lint
        # `ruff format --check` is not here yet: the codebase has never been
        # formatted, so it would fail on 19 files. Run `ruff format .` once, commit
        # that as its own change, then add the check here.
        run: ruff check .

      - name: Tests
        run: python -m unittest discover -s tests -v

  go:
    name: Go (vet + golangci-lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go-search/go.sum

      - name: Formatting
        # gofmt -l prints the unformatted files and exits 0, so check the output
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.1/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.1

      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."

      - name: Tests
        run: go test ./...

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        # oxlint reports these as warnings and exits 0; -D warnings makes them fail the job.
        # Three known set-state-in-effect warnings are not fixed yet, so warnings are
        # reported but do not fail. Remove --max-warnings once they are resolved.
        run: npx oxlint --max-warnings 3

      - name: Build
        run: npm run build
