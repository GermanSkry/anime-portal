name: Deploy

# Runs only after Code Quality has passed on main. GitHub cannot express
# `needs:` across workflows, so this chains on workflow_run instead — which also
# means this file is always read from main, never from a PR branch.
on:
  workflow_run:
    workflows: ["Code Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (a commit SHA). Leave empty to build from main."
        required: false
      fetch:
        description: "Re-download the catalogue from AniList first (~4 min)"
        type: boolean
        default: false
      ingest:
        description: "Re-ingest the catalogue, whether or not the pipeline changed"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/germanskry/anime-portal-backend
  GO_IMAGE: ghcr.io/germanskry/anime-portal-go-search

jobs:
  build:
    name: Build and push images
    # a failed Code Quality run must not reach the server
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ingest: ${{ steps.pipeline.outputs.changed }}
    steps:
      - name: Resolve the commit to deploy
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_run reports the triggering commit here; github.sha would be
            # whatever main pointed at when this workflow started
            SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "tag=$SHA" >> "$GITHUB_OUTPUT"
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.resolve.outputs.prebuilt == 'false'
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 2  # enough to diff against the previous commit

      - name: Did the data pipeline change?
        id: pipeline
        if: steps.resolve.outputs.prebuilt == 'false'
        run: |
          # compare against the previous commit on main; a merge brings several
          git fetch --quiet origin main --deepen=50 2>/dev/null || true
          changed=$(git diff --name-only HEAD~1 HEAD -- \
            backend/scripts/ingest_anime.py \
            backend/scripts/fetch_anime_enhanced.py \
            backend/app/utils/embeddings.py \
            backend/app/utils/query_terms.py || true)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "will re-ingest, because:"; echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data pipeline untouched, skipping ingest"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.resolve.outputs.prebuilt == 'false'

      - uses: docker/login-action@v4
        if: steps.resolve.outputs.prebuilt == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the torch layer dominates this image and almost never changes, so the
      # cache turns a ~2.1 GB build into a small one
      - name: Backend image
        if: steps.resolve.outputs.prebuilt == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.resolve.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Go search image
        if: steps.resolve.outputs.prebuilt == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./go-search
          push: true
          tags: |
            ${{ env.GO_IMAGE }}:${{ steps.resolve.outputs.tag }}
            ${{ env.GO_IMAGE }}:latest
          cache-from: type=gha,scope=go
          cache-to: type=gha,scope=go,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Say what is wrong here rather than letting ssh fail later with
          # "error in libcrypto", which is what a key pasted without its line
          # breaks produces. A fingerprint is not secret — ssh-keygen prints it
          # when the key is created.
          ssh-keygen -l -f ~/.ssh/deploy || {
            echo "::error::VPS_SSH_KEY is not a usable private key. Set it from the file instead of pasting: gh secret set VPS_SSH_KEY < ~/.ssh/animevibing_deploy"
            exit 1
          }
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "IMAGE_TAG=$TAG /opt/anime-portal/deploy.sh"

      - name: Refresh the catalogue from AniList
        if: inputs.fetch
        # ~4 minutes: 50 pages paced for AniList's 30 requests/minute. Keep the
        # SSH connection alive, the runner's default idle timeout is shorter.
        timeout-minutes: 20
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "FETCH=1 /opt/anime-portal/deploy.sh"

      - name: Ingest, if the data pipeline changed
        # Ingest is idempotent: it upserts on anilist_id and only recomputes an
        # embedding when that title's plot changed, so an unchanged catalogue is
        # a few seconds. Still gated on the files that can change what lands in
        # the database, so an unrelated commit does not touch it.
        # a fetch implies an ingest: new data is pointless until it is loaded
        if: needs.build.outputs.ingest == 'true' || inputs.ingest || inputs.fetch
        # the first ingest of a fresh catalogue is 2,500 embeddings on one
        # CPU-only vCPU, so give it room
        timeout-minutes: 45
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "INGEST=1 /opt/anime-portal/deploy.sh"

      - name: Verify the API answers
        run: |
          B=https://anime.necromemecon.party:2096
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$B/health" || true)
            [ "$code" = "200" ] && { echo "health ok after ${i}0s"; break; }
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::API never came back healthy"; exit 1; }
          # the embedding model loads lazily, so check a real query too
          curl -sf --max-time 20 "$B/api/anime?limit=1" > /dev/null
          echo "deployed ${{ needs.build.outputs.tag }}"
