services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg15  # stock postgres:15 has no `vector` type; semantic search needs it
    container_name: anime_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anime_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: anime_cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-backend:
    restart: unless-stopped
    # CI builds and pushes this; the VPS only pulls. `build:` stays so
    # `docker compose build python-backend` remains a working manual fallback.
    image: ghcr.io/germanskry/anime-portal-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anime_api
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/anime_db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SERPAPI_KEY: ${SERPAPI_KEY}
      MODEL_NAME: anthropic/claude-haiku-5.5
      KAFKA_BROKERS: redpanda:9092
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Without these the backend reports nothing: no exceptions to Sentry, and
      # none of llm_call, chat_message_sent, web_search or search_performed to
      # PostHog — which is most of what is worth measuring.
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_REGION: ${POSTHOG_REGION:-eu}
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # data only: mounting ./backend over /app would hide the image's code and
      # make a pulled image meaningless. anime.json is gitignored and lives here.
      - ./backend/data:/app/data
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000

  redpanda:
    restart: unless-stopped
    image: redpandadata/redpanda:latest
    container_name: anime_kafka
    command: >
      redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9644:9644"      # Admin API
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-search:
    restart: unless-stopped
    image: ghcr.io/germanskry/anime-portal-go-search:${IMAGE_TAG:-latest}
    build:
      context: ./go-search
      dockerfile: Dockerfile
    container_name: anime_search
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/anime_db?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      PYTHON_API_URL: http://python-backend:8000
      SERPAPI_KEY: ${SERPAPI_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SENTRY_DSN: ${SENTRY_DSN}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_REGION: ${POSTHOG_REGION:-eu}
      PORT: 8001
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "127.0.0.1:8011:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: anime-network
